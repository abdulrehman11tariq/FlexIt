<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Feedback Fast</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:320px;padding:18px;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 18px;color:#666;font-size:12px}
.value{text-align:center;font-weight:700;font-size:15px;margin:12px 0}
input{width:100%}
.scale{display:flex;justify-content:space-between;gap:4px;font-size:8px;color:#777}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
.status{text-align:center;min-height:16px;margin-top:9px;font-size:11px}
small{display:block;text-align:center;margin-top:12px;color:#888;font-size:9px}
</style>
</head>
<body>
<h1>⚡ Course Feedback Fast</h1>
<p>Your rating is saved locally. Nothing is sent anywhere.</p>
<div class="value" id="value">Strongly Agree</div>
<input id="rating" type="range" min="0" max="4" step="1" value="0">
<div class="scale">
<span>Strongly Agree</span><span>Agree</span><span>Uncertain</span>
<span>Dissatisfied</span><span>Strongly Disagree</span>
</div>
<button id="run">Run Feedback</button>
<div class="status" id="status"></div>
<small>No analytics • No accounts • No external servers</small>
<script src="popup.js"></script>
</body>
</html>
