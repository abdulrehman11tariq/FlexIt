<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Feedback Fast</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <main>
    <header class="head">
      <img class="logo" src="icons/icon48.png" alt="" width="32" height="32">
      <div class="titles">
        <h1>Course Feedback Fast</h1>
      </div>
      <span class="pill" id="pill"><i aria-hidden="true"></i><span id="pillText">Ready</span></span>
    </header>

    <section class="rating" id="rating">
      <div class="rating-top">
        <label for="slider">Your answer</label>
        <output id="value" for="slider">Strongly Agree</output>
      </div>

      <input id="slider" type="range" min="0" max="4" step="1" value="0" aria-valuetext="Strongly Agree">

      <div class="ticks" aria-hidden="true">
        <i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i>
      </div>
      <div class="ends" aria-hidden="true">
        <span>Strongly Agree</span>
        <span>Strongly Disagree</span>
      </div>
    </section>

    <section class="status" aria-live="polite">
      <p id="detail" class="detail">Open your feedback page, then press Start.</p>
      <div class="progress-row" id="progressRow" hidden>
        <div class="progress" id="progress" role="progressbar" aria-label="Courses completed" aria-valuemin="0">
          <span></span>
        </div>
        <span class="count" id="count"></span>
      </div>
    </section>

    <div class="controls">
      <label class="switch">
        <input id="autoRun" type="checkbox" role="switch">
        <span class="knob" aria-hidden="true"></span>
        <span class="switch-text">
          <strong>Auto-start when opened</strong>
          <small>You get a moment to cancel.</small>
        </span>
      </label>
      <button id="action" class="action" type="button">Start</button>
    </div>

    <footer>Stays in your browser. Nothing is sent anywhere.</footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
